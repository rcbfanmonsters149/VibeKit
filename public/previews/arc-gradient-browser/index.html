<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Arc Web Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#0f0e17',
                        accent: '#ff8906',
                        text: '#fffffe',
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassborder: 'rgba(255, 255, 255, 0.1)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        :root { --font-primary: 'Inter', sans-serif; }
        body { font-family: var(--font-primary); background-color: #0f0e17; color: #fffffe; }
        .gradient-mesh {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 15% 20%, rgba(255,137,6,0.2) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(139,92,246,0.2) 0%, transparent 40%);
            filter: blur(60px);
            z-index: -1;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(15, 14, 23, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex relative text-text">
    <div class="gradient-mesh"></div>

    <!-- LEFT SIDEBAR -->
    <div class="w-14 h-full glass-panel flex flex-col items-center py-4 gap-6 shrink-0 z-10 border-r border-glassborder">
        <!-- Pinned Apps -->
        <div class="flex flex-col gap-3">
            <button class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="github" class="w-5 h-5 text-white"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="figma" class="w-5 h-5 text-white"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-white flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="book-open" class="w-5 h-5 text-black"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-red-500 flex items-center justify-center hover:scale-105 transition-transform relative">
                <i data-lucide="hash" class="w-5 h-5 text-white"></i>
                <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-bg"></span>
            </button>
            <button class="w-10 h-10 rounded-full bg-red-500 flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="mail" class="w-5 h-5 text-white"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-black flex items-center justify-center border border-gray-700 hover:scale-105 transition-transform">
                <i data-lucide="twitter" class="w-5 h-5 text-white"></i>
            </button>
        </div>
        
        <div class="w-8 h-px bg-glassborder"></div>
        
        <!-- Spaces -->
        <div class="flex flex-col gap-3 relative w-full items-center">
            <div class="absolute left-0 top-1 bottom-1 w-1 bg-accent rounded-r-md"></div>
            <button class="w-10 h-10 rounded-xl bg-accent/20 flex items-center justify-center text-accent">
                <i data-lucide="briefcase" class="w-5 h-5"></i>
            </button>
            <button class="w-10 h-10 rounded-xl hover:bg-glass flex items-center justify-center text-blue-400">
                <i data-lucide="user" class="w-5 h-5"></i>
            </button>
            <button class="w-10 h-10 rounded-xl hover:bg-glass flex items-center justify-center text-green-400">
                <i data-lucide="code" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="mt-auto pb-2 flex flex-col gap-4">
            <button class="w-10 h-10 rounded-xl hover:bg-glass flex items-center justify-center text-gray-400">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col relative min-w-0 p-4 pl-0">
        <!-- Floating URL Bar -->
        <div class="absolute top-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2 bg-black/40 backdrop-blur-md border border-white/10 rounded-full px-4 py-2 w-full max-w-xl shadow-2xl">
            <i data-lucide="lock" class="w-4 h-4 text-green-400"></i>
            <span class="text-sm font-medium opacity-80 flex-1 truncate">vortex.arc/spaces/work</span>
            <div class="flex items-center gap-2">
                <button class="p-1 hover:bg-white/10 rounded-full text-gray-300"><i data-lucide="star" class="w-4 h-4"></i></button>
                <button class="p-1 hover:bg-white/10 rounded-full text-gray-300"><i data-lucide="rotate-cw" class="w-4 h-4"></i></button>
            </div>
        </div>

        <!-- Browser Shell Content -->
        <div class="flex-1 glass-panel rounded-2xl flex flex-col overflow-hidden border border-white/10 shadow-2xl ml-4">
            <!-- Tabs -->
            <div class="h-12 border-b border-white/5 flex items-end px-4 gap-2 pt-2 bg-black/20">
                <div class="bg-white/5 border border-white/10 border-b-0 rounded-t-lg px-4 py-2 text-sm flex items-center gap-2 min-w-[150px] relative">
                    <div class="absolute top-0 left-0 right-0 h-0.5 bg-accent rounded-t-lg"></div>
                    <i data-lucide="figma" class="w-4 h-4 text-purple-400"></i>
                    <span class="truncate w-24">Dashboard — Figma</span>
                    <button class="ml-auto opacity-50 hover:opacity-100"><i data-lucide="x" class="w-3 h-3"></i></button>
                </div>
                <div class="hover:bg-white/5 border border-transparent rounded-t-lg px-4 py-2 text-sm flex items-center gap-2 min-w-[150px] text-gray-400 transition-colors">
                    <i data-lucide="github" class="w-4 h-4 text-white"></i>
                    <span class="truncate w-24">GitHub PRs</span>
                    <button class="ml-auto opacity-50 hover:opacity-100"><i data-lucide="x" class="w-3 h-3"></i></button>
                </div>
                <button class="px-3 py-2 text-gray-400 hover:text-white hover:bg-white/5 rounded-t-lg transition-colors flex items-center gap-1 text-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Tab
                </button>
            </div>

            <!-- Webpage Content (Mock Dashboard) -->
            <div class="flex-1 bg-[#15151a] overflow-auto p-8">
                <div class="max-w-5xl mx-auto space-y-6">
                    <header class="flex justify-between items-center mb-8 mt-12">
                        <h1 class="text-3xl font-bold text-white">Analytics Overview</h1>
                        <button class="px-4 py-2 bg-accent text-white rounded-lg text-sm font-medium hover:bg-opacity-90">Download Report</button>
                    </header>
                    
                    <div class="grid grid-cols-3 gap-6">
                        <div class="bg-white/5 border border-white/10 rounded-xl p-6">
                            <h3 class="text-gray-400 text-sm mb-2">Total Revenue</h3>
                            <div class="text-3xl font-bold">$124,592</div>
                            <div class="text-green-400 text-sm flex items-center mt-2"><i data-lucide="trending-up" class="w-4 h-4 mr-1"></i> +14.5%</div>
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-xl p-6">
                            <h3 class="text-gray-400 text-sm mb-2">Active Users</h3>
                            <div class="text-3xl font-bold">12,491</div>
                            <div class="text-green-400 text-sm flex items-center mt-2"><i data-lucide="trending-up" class="w-4 h-4 mr-1"></i> +5.2%</div>
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-xl p-6">
                            <h3 class="text-gray-400 text-sm mb-2">Conversion Rate</h3>
                            <div class="text-3xl font-bold">3.84%</div>
                            <div class="text-red-400 text-sm flex items-center mt-2"><i data-lucide="trending-down" class="w-4 h-4 mr-1"></i> -1.2%</div>
                        </div>
                    </div>

                    <div class="bg-white/5 border border-white/10 rounded-xl p-6 h-80 flex flex-col relative overflow-hidden mt-6">
                        <h3 class="text-gray-400 text-sm mb-6">Traffic Sources (Last 30 Days)</h3>
                        <div class="flex-1 flex items-end gap-2 px-2 mt-4">
                            <!-- Mock chart bars -->
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[40%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[65%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/80 hover:bg-accent rounded-t-md h-[80%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[50%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[70%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[95%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[60%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[45%] transition-colors relative group"></div>
                            <div class="flex-1 bg-accent/40 hover:bg-accent/60 rounded-t-md h-[85%] transition-colors relative group"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Keyboard Hint -->
        <div class="absolute bottom-4 left-6 text-xs text-gray-500 flex items-center gap-2">
            <span class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10">⌘</span> + <span class="px-1.5 py-0.5 rounded bg-white/5 border border-white/10">K</span> navigate ↔ open
        </div>
    </div>

    <script>
        lucide.createIcons();
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'CHANGE_FONT') {
                const font = e.data.font;
                document.documentElement.style.setProperty('--font-primary', '"' + font + '", sans-serif');
            }
        });
    </script>
</body>
</html>
